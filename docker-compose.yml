services:
  easecargo:
    build:
      context: .
      dockerfile: Dockerfile
    image: easecargo:latest
    container_name: easecargo
    ports:
      - "5000:5000"
    environment:
      FLASK_ENV: production
      DATABASE_URL: sqlite:////app/instance/easecargo.db
    volumes:
      - easecargo_instance:/app/instance
    restart: unless-stopped

volumes:
  easecargo_instance:
# Generated by Containerization Assist (AI)
# Kubernetes Ingress Manifest for EaseCargo
# Provides external HTTP(S) routing and load balancing

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: easecargo-ingress
  namespace: default
  labels:
    app: easecargo
    version: v1
  annotations:
    # Annotations for Azure Application Gateway or Nginx Ingress Controller
    cert-manager.io/cluster-issuer: "letsencrypt-prod"  # For Let's Encrypt TLS
    kubernetes.io/ingress.class: "nginx"  # Or "azure/application-gateway"

spec:
  # TLS Configuration (requires cert-manager)
  # tls:
  # - hosts:
  #   - easecargo.example.com
  #   secretName: easecargo-tls-cert

  rules:
  # Primary domain
  - host: easecargo.example.com  # Replace with your domain
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: easecargo-service
            port:
              number: 80
  
  # Alternative domain (optional)
  # - host: cargo.example.com
  #   http:
  #     paths:
  #     - path: /
  #       pathType: Prefix
  #       backend:
  #         service:
  #           name: easecargo-service
  #           port:
  #             number: 80

---

# Optional: NetworkPolicy for Kubernetes network security
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: easecargo-network-policy
  namespace: default
  labels:
    app: easecargo

spec:
  podSelector:
    matchLabels:
      app: easecargo
  
  # Allow ingress from anywhere (for public API)
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    ports:
    - protocol: TCP
      port: 5000
  
  # Default: deny all egress unless explicitly allowed
  # egress:
  # - to:
  #   - namespaceSelector: {}
  #   ports:
  #   - protocol: TCP
  #     port: 53  # DNS
  #   - protocol: TCP
  #     port: 443  # HTTPS
  #   - protocol: TCP
  #     port: 5432  # PostgreSQL (if used)

---

# Optional: HorizontalPodAutoscaler for automatic scaling
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: easecargo-hpa
  namespace: default
  labels:
    app: easecargo

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: easecargo
  
  minReplicas: 3      # Minimum 3 pods
  maxReplicas: 10     # Maximum 10 pods
  
  metrics:
  # Scale on CPU usage
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70  # Scale up when avg CPU > 70%
  
  # Scale on memory usage
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80  # Scale up when avg memory > 80%
  
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30

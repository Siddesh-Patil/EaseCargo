# Generated by Containerization Assist (AI)
# Kubernetes ConfigMap Manifest for EaseCargo
# Stores non-sensitive configuration data as environment variables

apiVersion: v1
kind: ConfigMap
metadata:
  name: easecargo-config
  namespace: default
  labels:
    app: easecargo
    version: v1
  annotations:
    description: "Configuration for EaseCargo application"

data:
  # Flask Configuration
  FLASK_APP: "app.py"
  FLASK_ENV: "production"
  PYTHONUNBUFFERED: "1"
  
  # Database Configuration (SQLite is used by default)
  # For production with Postgres, change to:
  # DATABASE_URL: "postgresql://user:password@postgres-service:5432/easecargo"
  DATABASE_URL: "sqlite:////app/instance/easecargo.db"
  
  # Application Configuration
  JSON_SORT_KEYS: "False"
  
  # Gunicorn Configuration (from entrypoint.sh)
  # GUNICORN_WORKERS: "4"
  # GUNICORN_TIMEOUT: "60"

---

# Kubernetes Secret for sensitive data
# Create this separately or use Azure Key Vault integration
apiVersion: v1
kind: Secret
metadata:
  name: easecargo-secrets
  namespace: default
  labels:
    app: easecargo
    version: v1

type: Opaque

data:
  # Replace these with base64-encoded actual values
  # Generate with: echo -n "value" | base64
  SECRET_KEY: ZWFzZWNhcmdvLWt1YmVybmV0ZXMtc2VjcmV0LWtleTIwMjU=  # easecargo-kubernetes-secret-key2025

---

# Persistent Volume Claim for database storage
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: easecargo-db-pvc
  namespace: default
  labels:
    app: easecargo
    version: v1

spec:
  accessModes:
    - ReadWriteOnce  # Single pod access
  storageClassName: default  # Use default storage class or specify custom one
  resources:
    requests:
      storage: 5Gi  # Adjust based on expected data size

---

# Optional: StorageClass for dynamic provisioning (uncomment if needed)
# apiVersion: storage.k8s.io/v1
# kind: StorageClass
# metadata:
#   name: easecargo-storage
# provisioner: kubernetes.io/azure-disk
# parameters:
#   skuName: Standard_LRS  # or Premium_LRS for better performance
#   kind: Managed
# reclaimPolicy: Delete
# allowVolumeExpansion: true

---

# Service Account for Kubernetes RBAC
apiVersion: v1
kind: ServiceAccount
metadata:
  name: easecargo
  namespace: default
  labels:
    app: easecargo
    version: v1
  annotations:
    description: "Service account for EaseCargo pods"

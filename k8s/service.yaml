# Generated by Containerization Assist (AI)
# Kubernetes Service Manifest for EaseCargo
# Exposes the EaseCargo application within the cluster and optionally to the internet

apiVersion: v1
kind: Service
metadata:
  name: easecargo-service
  namespace: default
  labels:
    app: easecargo
    version: v1
  annotations:
    description: "Service for EaseCargo application"

spec:
  type: LoadBalancer  # Use LoadBalancer for public access, ClusterIP for internal only
  
  # Session affinity for sticky sessions (optional)
  sessionAffinity: None
  
  # Session affinity timeout (if enabled)
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800
  
  # Port configuration
  ports:
  - name: http
    port: 80           # External port
    targetPort: 5000   # Container port
    protocol: TCP
  
  # Optional: HTTPS port (requires TLS cert)
  # - name: https
  #   port: 443
  #   targetPort: 5000
  #   protocol: TCP
  
  # Label selector for pods to route traffic to
  selector:
    app: easecargo

---

# ClusterIP Service for internal communication (optional)
apiVersion: v1
kind: Service
metadata:
  name: easecargo-internal
  namespace: default
  labels:
    app: easecargo
    version: v1

spec:
  type: ClusterIP  # Internal-only service
  
  ports:
  - name: http
    port: 5000
    targetPort: 5000
    protocol: TCP
  
  selector:
    app: easecargo

# Generated by Containerization Assist (AI)
# Kubernetes Deployment Manifest for EaseCargo
# This deployment runs the EaseCargo Flask application in a Kubernetes cluster

apiVersion: apps/v1
kind: Deployment
metadata:
  name: easecargo
  namespace: default
  labels:
    app: easecargo
    version: v1
  annotations:
    description: "Smart Container Space Matching Platform with Fuzzy Logic"

spec:
  replicas: 3  # Run 3 replicas for high availability
  
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0  # Ensure zero downtime during updates
  
  selector:
    matchLabels:
      app: easecargo
  
  template:
    metadata:
      labels:
        app: easecargo
        version: v1
      annotations:
        prometheus.io/scrape: "false"  # Toggle to true if using Prometheus
    
    spec:
      # Security context for the pod
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      
      # Service account (for Azure Managed Identity integration)
      serviceAccountName: easecargo
      
      # Pod restart policy
      restartPolicy: Always
      
      # Termination grace period for graceful shutdown
      terminationGracePeriodSeconds: 30
      
      containers:
      - name: easecargo
        image: easecargo:latest
        imagePullPolicy: Always  # Change to IfNotPresent for private registries after initial pull
        
        # Container port
        ports:
        - name: http
          containerPort: 5000
          protocol: TCP
        
        # Environment variables from ConfigMap and Secrets
        envFrom:
        - configMapRef:
            name: easecargo-config
        - secretRef:
            name: easecargo-secrets
            optional: true
        
        # Individual environment variables
        env:
        - name: FLASK_ENV
          value: "production"
        - name: PYTHONUNBUFFERED
          value: "1"
        
        # Resource requests and limits
        resources:
          requests:
            cpu: 250m          # Minimum CPU
            memory: 512Mi      # Minimum memory
          limits:
            cpu: 500m          # Maximum CPU
            memory: 1Gi        # Maximum memory
        
        # Startup probe (checks if app is ready to serve)
        startupProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 30  # 10s * 30 = 300s max startup time
        
        # Liveness probe (restarts container if unhealthy)
        livenessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        
        # Readiness probe (marks pod as ready for traffic)
        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
        
        # Security context for the container
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          runAsNonRoot: true
          runAsUser: 1000
          capabilities:
            drop:
            - ALL
        
        # Volume mounts
        volumeMounts:
        - name: db-storage
          mountPath: /app/instance
        - name: static-files
          mountPath: /app/static
          readOnly: true
      
      # Volumes
      volumes:
      - name: db-storage
        persistentVolumeClaim:
          claimName: easecargo-db-pvc
      - name: static-files
        emptyDir: {}
      
      # Affinity rules (optional)
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - easecargo
              topologyKey: kubernetes.io/hostname
